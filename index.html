<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F3EE" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="Calendora — a touch-friendly family wall calendar with chores, rewards, lists, meal planning and a photo frame." />
  <title>Calendora</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23F7936F'/%3E%3Cstop offset='1' stop-color='%23E5533A'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='34' r='14' fill='none' stroke='white' stroke-width='6'/%3E%3Crect x='38' y='22' width='14' height='24' fill='url(%23g)'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar" aria-label="Main"></nav>
    <div class="main">
      <header class="topbar">
        <div class="clock">
          <div class="time" id="clockTime"></div>
          <div class="date" id="clockDate"></div>
        </div>
        <div class="weather" id="weather" hidden></div>
        <div class="member-filter" id="memberFilter" aria-label="Show or hide family members"></div>
      </header>
      <section class="toolbar" id="toolbar"></section>
      <section class="view" id="view"></section>
    </div>
    <button class="fab" id="fab" aria-label="Add">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div id="modalRoot"></div>
  <div class="screensaver" id="screensaver" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="photoInput" accept="image/*" multiple hidden />
  <input type="file" id="importInput" accept="application/json,.json" hidden />

  <script src="app.js"></script>
</body>
</html>
